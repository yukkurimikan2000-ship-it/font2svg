<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TTF → Text → SVG 変換 + Google Fonts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    color-scheme: dark;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: 24px;
    background: radial-gradient(circle at top, #1a1a1a 0, #050505 45%, #000 100%);
    color: #f5f5f7;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* --- 制作リンク（Liquid Grass風） --- */
  .creator {
    text-align: center;
    font-size: 14px;
    margin-bottom: 10px;
  }

  .creator a {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 20px;
    text-decoration: none;
    color: #fff;
    font-weight: 600;
    background: linear-gradient(135deg,
      rgba(255,255,255,0.25),
      rgba(255,255,255,0.05));
    border: 1px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow:
      0 8px 30px rgba(0,0,0,0.6),
      inset 0 0 0 1px rgba(255,255,255,0.1);
    transition: 0.2s;
  }

  .creator a:hover {
    background: linear-gradient(135deg,
      rgba(255,255,255,0.35),
      rgba(255,255,255,0.1));
    transform: translateY(-1px);
  }

  /* --- Liquid Grass Glass UI --- */
  .glass {
    background: rgba(255, 255, 255, 0.06);
    border-radius: 24px;
    padding: 18px 18px 20px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow:
      0 18px 45px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    backdrop-filter: blur(28px) saturate(220%);
    -webkit-backdrop-filter: blur(28px) saturate(220%);
  }

  h1 {
    font-size: 22px;
    letter-spacing: 0.03em;
    margin: 0 0 8px;
  }

  .subtitle {
    font-size: 12px;
    color: #a0a0aa;
    margin-bottom: 12px;
  }

  label {
    display: block;
    margin: 10px 0 4px;
    font-size: 13px;
    color: #d0d0da;
  }

  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    max-width: 360px;
    padding: 10px 12px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: radial-gradient(circle at top left,
      rgba(255, 255, 255, 0.16),
      rgba(0, 0, 0, 0.7));
    color: #f5f5f7;
    font-size: 14px;
    outline: none;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.04) inset,
      0 10px 25px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  input[type="file"] {
    margin-top: 4px;
    font-size: 12px;
  }

  button {
    margin-top: 14px;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: radial-gradient(circle at 20% 0,
      rgba(255, 255, 255, 0.35),
      rgba(0, 0, 0, 0.9));
    color: #fefefe;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.03em;
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.8),
      0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: 0.12s ease;
  }

  button:active {
    transform: translateY(1px) scale(0.98);
  }

  #preview {
    margin-top: 16px;
    padding: 14px;
    background: radial-gradient(circle at top left,
      rgba(255, 255, 255, 0.12),
      rgba(0, 0, 0, 0.9));
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }

  svg {
    background: #fff;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
  }

  footer {
    font-size: 11px;
    color: #777783;
    text-align: center;
    margin-top: 4px;
  }
</style>
</head>
<body>

  <!-- 制作リンク -->
  <div class="creator">
    <a href="https://scratch.mit.edu/users/mikan2020love/" target="_blank">
      制作 mikan2020love
    </a>
  </div>

  <div class="glass">
    <h1>TTF / OTF / OFF → SVG テキスト</h1>
    <div class="subtitle">Google Fonts とローカルフォントからアウトラインSVGを生成</div>

    <label>Google Fonts（自動読み込み）</label>
    <div class="row">
      <select id="googleFontSelect">
        <option value="">選択しない</option>
        <option value="Roboto">Roboto</option>
        <option value="Noto Sans JP">Noto Sans JP（日本語サンセリフ）</option>
        <option value="Noto Serif JP">Noto Serif JP（日本語明朝体）</option>
        <option value="M PLUS 1p">M PLUS 1p</option>
        <option value="Noto Sans">Noto Sans</option>
        <option value="Noto Serif">Noto Serif</option>
      </select>
      <button id="loadGoogleFontBtn">Google Font 読み込み</button>
    </div>

    <label>ローカルフォント（TTF / OTF / OFF）</label>
    <input type="file" id="fontFile" accept=".ttf,.otf,.off">

    <label>文字列</label>
    <input type="text" id="textInput" value="Hello SVG">

    <label>フォントサイズ（px）</label>
    <input type="number" id="fontSize" value="120">

    <div class="row">
      <button id="generateBtn">SVG生成</button>
      <button id="downloadBtn" disabled>SVGをダウンロード</button>
    </div>

    <div id="preview"></div>
  </div>

  <footer>Liquid Grass UI / opentype.js SVG Generator</footer>

  <!-- OpenType.js -->
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script>
    let loadedFont = null;
    let lastSvg = "";

    function getGoogleFontTTFUrl(fontName) {
      const base = "https://fonts.gstatic.com/s/";
      const map = {
        "Roboto": "roboto/v30/KFOmCnqEu92Fr1Mu4mxP.ttf",
        "Noto Sans JP": "notosansjp/v52/-F6ofjtqLzI2JPCgQBnw7HFQogg.ttf",
        "Noto Serif JP": "notoserifjp/v21/xn7gYHE5xXg0c5e1x9nqYw.ttf",
        "M PLUS 1p": "mplus1p/v12/e3tmeuShHdiFyPFzBRrQ.ttf",
        "Noto Sans": "notosans/v27/o-0IIpQlx3QUlC5A4PNr6A.ttf",
        "Noto Serif": "notoserif/v22/ga6Iaw1J5X9T9RW6j9bNfA.ttf"
      };
      return base + map[fontName];
    }

    document.getElementById("loadGoogleFontBtn").addEventListener("click", async () => {
      const fontName = document.getElementById("googleFontSelect").value;
      if (!fontName) return alert("Google Font を選択してください");

      try {
        const res = await fetch(getGoogleFontTTFUrl(fontName));
        const buffer = await res.arrayBuffer();
        loadedFont = opentype.parse(buffer);
        alert("Google Font 読み込み成功: " + fontName);
      } catch {
        alert("読み込みに失敗しました");
      }
    });

    document.getElementById("fontFile").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const buffer = await file.arrayBuffer();
        loadedFont = opentype.parse(buffer);
        alert("フォント読み込み成功: " + file.name);
      } catch {
        alert("フォントの読み込みに失敗しました");
      }
    });

    document.getElementById("generateBtn").addEventListener("click", () => {
      if (!loadedFont) return alert("フォントを読み込んでください");

      const text = textInput.value;
      const size = parseFloat(fontSizeInput.value);

      const path = loadedFont.getPath(text, 0, 0, size);
      const d = path.toPathData(2);
      const box = path.getBoundingBox();

      const pad = size * 0.2;
      const w = box.x2 - box.x1 + pad * 2;
      const h = box.y2 - box.y1 + pad * 2;

      const svg =
`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
  <path d="${d}" transform="translate(${-box.x1 + pad}, ${-box.y1 + pad})" fill="black"/>
</svg>`;

      lastSvg = svg;
      downloadBtn.disabled = false;
      preview.innerHTML = svg;
    });

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const blob = new Blob([lastSvg], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "text.svg";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
